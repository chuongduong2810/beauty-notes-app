<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Spatial Creative Workspace</title>
    <!-- Lora — warm serif, claude.ai-style — for the (invisible) DOM
         textarea. Google Fonts CDN serves WOFF2 which the browser uses
         natively. The WebGL SDF text in NoteMesh.tsx loads the same
         font as a self-hosted TTF from /public/fonts/, because troika
         can't follow the Google CSS link (it needs a direct TTF URL). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
    <style>
      /* Two font roles for the app (#22):
         - --ui-font: Lora — for chrome that lives next to Notes
           (RoomPicker, ToolPalette, NoteEditor). Same serif Notes
           themselves use, so chrome and content share one typeface.
         - --hud-font: JetBrains Mono fallback chain — for the
           futuristic HUD overlays (HoverTooltip, SplashScreen,
           RoomSwitchingOverlay). The mono cell width is what makes
           the typing animations, blinking caret, and corner brackets
           read as a sci-fi terminal. */
      :root {
        --ui-font: "Lora", Georgia, "Times New Roman", serif;
        --hud-font: "JetBrains Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      html, body, #root { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #0e0b16; }
      body { font-family: var(--ui-font); }
      /* User-agent stylesheets give <button>, <input>, <textarea>,
         <select> their own font that does NOT inherit from body.
         Force inheritance so every form element picks up Lora — the
         ToolPalette pills, RoomPicker trigger, and any future
         button stay consistent with the rest of the chrome. */
      button, input, select, textarea { font-family: inherit; }

      /* Styled scrollbar for the NoteEditor textarea — appears when a
         focused Note's body is longer than the visible rect. Firefox
         uses the standard scrollbar-* properties; Chromium / WebKit
         uses the ::-webkit-* pseudo-elements. Colours are tied to the
         warm palette so the bar reads as part of the paper rather than
         a browser chrome graft. */
      textarea[data-note-editor] {
        scrollbar-width: thin;
        scrollbar-color: rgba(42, 35, 48, 0.35) transparent;
      }
      textarea[data-note-editor]::-webkit-scrollbar {
        width: 8px;
      }
      textarea[data-note-editor]::-webkit-scrollbar-track {
        background: transparent;
      }
      textarea[data-note-editor]::-webkit-scrollbar-thumb {
        background: rgba(42, 35, 48, 0.35);
        border-radius: 4px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      textarea[data-note-editor]::-webkit-scrollbar-thumb:hover {
        background: rgba(42, 35, 48, 0.6);
        background-clip: content-box;
      }

      /* Bookmark ("keep handy") toggle for the focused Note (issue #55).
         A small ribbon button anchored to the focused Note's top-right
         corner. Off state is a hollow outline tucked into the paper;
         on state fills with the warm accent so a Bookmarked Note reads
         at a glance. Sized in px from the projected rect by inline
         style so it scales with camera distance like the textarea. */
      button[data-note-bookmark] {
        position: fixed;
        display: grid;
        place-items: center;
        padding: 0;
        border: none;
        background: transparent;
        color: rgba(42, 35, 48, 0.45);
        cursor: pointer;
        line-height: 0;
        z-index: 21;
        transition: color 120ms ease, transform 120ms ease;
      }
      button[data-note-bookmark]:hover {
        color: rgba(42, 35, 48, 0.75);
        transform: scale(1.08);
      }
      button[data-note-bookmark][aria-pressed="true"] {
        color: #b8553f;
      }

      /* Futuristic 3D hover toast for interactive 3D props (issue
         #35 follow-up). Glass background, cyan neon border, HUD
         corner brackets, scanline shimmer, blinking terminal cursor,
         floating bob, pulsing glow. Rendered inside a drei
         <Html transform sprite> so the card billboards in 3D space
         and scales with camera distance. */
      .hover-toast {
        position: relative;
        font-family: var(--hud-font);
        padding: 14px 22px;
        min-width: 220px;
        background:
          linear-gradient(
            180deg,
            rgba(15, 22, 42, 0.85) 0%,
            rgba(10, 12, 22, 0.85) 100%
          );
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(92, 242, 232, 0.55);
        border-radius: 4px;
        color: #d8fffb;
        text-align: center;
        box-shadow:
          0 0 24px rgba(92, 242, 232, 0.32),
          inset 0 0 18px rgba(92, 242, 232, 0.1),
          0 6px 32px rgba(0, 0, 0, 0.55);
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
        transform-origin: 50% 100%;
        overflow: hidden;
        /* Continuous + entrance animation. The float and glow loop
           forever; the enter runs once. */
        animation:
          hover-toast-enter 320ms cubic-bezier(0.22, 1, 0.36, 1) both,
          hover-toast-float 3.6s ease-in-out 320ms infinite,
          hover-toast-pulse 2.4s ease-in-out 320ms infinite;
      }
      .hover-toast::before {
        /* Top gradient hairline — the HUD's "live channel" indicator. */
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          #5cf2e8 30%,
          #c46cff 50%,
          #5cf2e8 70%,
          transparent 100%
        );
        background-size: 200% 100%;
        animation: hover-toast-sweep 2.6s linear infinite;
      }
      .hover-toast::after {
        /* Downward triangle pointer toward the anchored object. */
        content: "";
        position: absolute;
        left: 50%;
        bottom: -7px;
        width: 12px;
        height: 12px;
        transform: translateX(-50%) rotate(45deg);
        background: rgba(10, 12, 22, 0.85);
        border-right: 1px solid rgba(92, 242, 232, 0.55);
        border-bottom: 1px solid rgba(92, 242, 232, 0.55);
        box-shadow: 2px 2px 12px rgba(92, 242, 232, 0.28);
      }
      /* Four HUD-style corner brackets — short cyan strokes that
         outline the toast's corners without filling the whole edge. */
      .hover-toast__bracket {
        position: absolute;
        width: 10px;
        height: 10px;
        border-color: #5cf2e8;
        box-shadow: 0 0 6px rgba(92, 242, 232, 0.6);
        pointer-events: none;
      }
      .hover-toast__bracket--tl {
        top: -2px;
        left: -2px;
        border-top: 1.5px solid;
        border-left: 1.5px solid;
      }
      .hover-toast__bracket--tr {
        top: -2px;
        right: -2px;
        border-top: 1.5px solid;
        border-right: 1.5px solid;
      }
      .hover-toast__bracket--bl {
        bottom: -2px;
        left: -2px;
        border-bottom: 1.5px solid;
        border-left: 1.5px solid;
      }
      .hover-toast__bracket--br {
        bottom: -2px;
        right: -2px;
        border-bottom: 1.5px solid;
        border-right: 1.5px solid;
      }
      /* Scanline overlay — fine repeating horizontal lines drifting
         downward for a CRT-HUD vibe. */
      .hover-toast__scan {
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(
          0deg,
          rgba(92, 242, 232, 0.06) 0px,
          rgba(92, 242, 232, 0.06) 1px,
          transparent 1px,
          transparent 3px
        );
        animation: hover-toast-scan 2.8s linear infinite;
        pointer-events: none;
        opacity: 0.7;
      }
      .hover-toast__title {
        position: relative;
        font-size: 13px;
        letter-spacing: 0.24em;
        font-weight: 600;
        text-transform: uppercase;
        color: #5cf2e8;
        text-shadow:
          0 0 8px rgba(92, 242, 232, 0.7),
          0 0 16px rgba(92, 242, 232, 0.35);
      }
      .hover-toast__subtitle {
        position: relative;
        margin-top: 4px;
        font-size: 11px;
        letter-spacing: 0.05em;
        color: rgba(216, 255, 251, 0.85);
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .hover-toast__subtitle-text {
        /* Type-on effect: width animates from 0 to full so the chars
           appear left-to-right. Combined with overflow:hidden on the
           parent and white-space:nowrap, this reads as a HUD typing it
           out. */
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
        animation: hover-toast-type 0.65s steps(28) 280ms both;
      }
      .hover-toast__caret {
        display: inline-block;
        width: 6px;
        height: 11px;
        background: #5cf2e8;
        box-shadow: 0 0 6px rgba(92, 242, 232, 0.85);
        animation: hover-toast-blink 0.9s steps(2) infinite;
      }
      @keyframes hover-toast-enter {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.85) rotateX(-25deg);
          filter: blur(3px);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1) rotateX(0deg);
          filter: blur(0);
        }
      }
      @keyframes hover-toast-float {
        0%, 100% {
          transform: translateY(0) scale(1) rotateX(0deg);
        }
        50% {
          transform: translateY(-4px) scale(1) rotateX(0deg);
        }
      }
      @keyframes hover-toast-pulse {
        0%, 100% {
          box-shadow:
            0 0 24px rgba(92, 242, 232, 0.32),
            inset 0 0 18px rgba(92, 242, 232, 0.1),
            0 6px 32px rgba(0, 0, 0, 0.55);
        }
        50% {
          box-shadow:
            0 0 36px rgba(92, 242, 232, 0.55),
            inset 0 0 24px rgba(92, 242, 232, 0.18),
            0 6px 32px rgba(0, 0, 0, 0.55);
        }
      }
      @keyframes hover-toast-sweep {
        0% {
          background-position: -100% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }
      @keyframes hover-toast-scan {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: 0 12px;
        }
      }
      @keyframes hover-toast-type {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }
      @keyframes hover-toast-blink {
        0%, 50% {
          opacity: 1;
        }
        50.01%, 100% {
          opacity: 0;
        }
      }

      /* Animated futuristic splash shown while the Room bootstraps.
         Full-screen DOM overlay over the canvas; fades out once the
         store flips ready=true. Same neon-cyan vocabulary as the
         hover-toast so the HUD vibe is consistent. */
      .splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            ellipse at center,
            rgba(20, 26, 48, 1) 0%,
            rgba(14, 11, 22, 1) 70%
          );
        font-family: var(--hud-font);
        color: #d8fffb;
        user-select: none;
        opacity: 1;
        transition:
          opacity 600ms cubic-bezier(0.4, 0, 0.2, 1),
          backdrop-filter 600ms ease;
      }
      .splash--hiding {
        opacity: 0;
        pointer-events: none;
      }
      .splash__scan {
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(
          0deg,
          rgba(92, 242, 232, 0.05) 0px,
          rgba(92, 242, 232, 0.05) 1px,
          transparent 1px,
          transparent 3px
        );
        animation: splash-scan 4s linear infinite;
        pointer-events: none;
      }
      .splash__content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        animation: splash-enter 480ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .splash__ring {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 1.5px solid rgba(92, 242, 232, 0.18);
        box-shadow:
          0 0 24px rgba(92, 242, 232, 0.18),
          inset 0 0 14px rgba(92, 242, 232, 0.08);
      }
      .splash__ring-arc {
        position: absolute;
        inset: -1.5px;
        border-radius: 50%;
        /* Conic gradient: cyan arc, the rest transparent. Mask makes
           the conic only paint a stroke instead of a filled disc. */
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          transparent 270deg,
          #5cf2e8 360deg
        );
        -webkit-mask: radial-gradient(
          circle,
          transparent 38px,
          black 39.5px,
          black 44px,
          transparent 45.5px
        );
        mask: radial-gradient(
          circle,
          transparent 38px,
          black 39.5px,
          black 44px,
          transparent 45.5px
        );
        filter: drop-shadow(0 0 6px rgba(92, 242, 232, 0.75));
        animation: splash-spin 1.2s linear infinite;
      }
      .splash__ring-dot {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #5cf2e8;
        box-shadow:
          0 0 12px rgba(92, 242, 232, 0.85),
          0 0 24px rgba(92, 242, 232, 0.45);
        transform: translate(-50%, -50%);
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      .splash__wordmark {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.34em;
        /* The name spans three words now — keep it centered and let it
           wrap on narrow viewports instead of overflowing. */
        max-width: 80vw;
        text-align: center;
        line-height: 1.5;
        color: #5cf2e8;
        text-shadow:
          0 0 10px rgba(92, 242, 232, 0.7),
          0 0 24px rgba(92, 242, 232, 0.35);
        text-transform: uppercase;
        /* Sliding gradient highlight from left to right. */
        background: linear-gradient(
          90deg,
          rgba(92, 242, 232, 1) 0%,
          rgba(196, 108, 255, 1) 50%,
          rgba(92, 242, 232, 1) 100%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: splash-shimmer 3.2s linear infinite;
      }
      .splash__status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: rgba(216, 255, 251, 0.78);
      }
      .splash__status-prompt {
        color: #5cf2e8;
        text-shadow: 0 0 6px rgba(92, 242, 232, 0.7);
      }
      .splash__status-text {
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
        animation: splash-type 1.4s steps(14) 320ms infinite;
      }
      .splash__status-caret {
        display: inline-block;
        width: 6px;
        height: 11px;
        background: #5cf2e8;
        box-shadow: 0 0 6px rgba(92, 242, 232, 0.85);
        animation: hover-toast-blink 0.9s steps(2) infinite;
      }
      .splash__bar {
        position: relative;
        width: 200px;
        height: 2px;
        background: rgba(92, 242, 232, 0.14);
        border-radius: 1px;
        overflow: hidden;
      }
      .splash__bar-fill {
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent 0%,
          #5cf2e8 50%,
          transparent 100%
        );
        box-shadow: 0 0 8px rgba(92, 242, 232, 0.6);
        animation: splash-bar 1.6s ease-in-out infinite;
      }
      @keyframes splash-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes splash-pulse {
        0%, 100% {
          opacity: 0.9;
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.4);
        }
      }
      @keyframes splash-shimmer {
        0% {
          background-position: -100% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }
      @keyframes splash-type {
        0% {
          width: 0;
        }
        45%, 100% {
          width: 100%;
        }
      }
      @keyframes splash-scan {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: 0 12px;
        }
      }
      @keyframes splash-enter {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes splash-bar {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }

      /* Small centered "Loading Room" overlay shown while switchRoom
         / createRoom is in flight (#22). Smaller and less heavy than
         the bootstrap splash — the canvas is still showing the
         previous Room behind the dim. */
      .room-switching {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 8, 16, 0.45);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        pointer-events: all;
        animation: room-switching-fade 160ms ease-out;
      }
      .room-switching__card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 22px 28px;
        border-radius: 12px;
        background: rgba(20, 16, 28, 0.92);
        border: 1px solid rgba(92, 242, 232, 0.4);
        box-shadow:
          0 0 22px rgba(92, 242, 232, 0.22),
          0 10px 32px rgba(0, 0, 0, 0.45);
        color: #d8fffb;
        font-family: var(--hud-font);
      }
      .room-switching__ring {
        position: relative;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1.5px solid rgba(92, 242, 232, 0.18);
        box-shadow: inset 0 0 8px rgba(92, 242, 232, 0.08);
      }
      .room-switching__ring-arc {
        position: absolute;
        inset: -1.5px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          transparent 270deg,
          #5cf2e8 360deg
        );
        -webkit-mask: radial-gradient(
          circle,
          transparent 16px,
          black 17.5px,
          black 22px,
          transparent 23.5px
        );
        mask: radial-gradient(
          circle,
          transparent 16px,
          black 17.5px,
          black 22px,
          transparent 23.5px
        );
        filter: drop-shadow(0 0 5px rgba(92, 242, 232, 0.7));
        animation: splash-spin 1.1s linear infinite;
      }
      .room-switching__label {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #5cf2e8;
        text-shadow: 0 0 6px rgba(92, 242, 232, 0.55);
      }
      @keyframes room-switching-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* ── Notebook pages (issue #57, ADR-0016) ──────────────────────
         Page content is PRINTED onto the open book's ruled paper via
         <Html transform>: the DOM is fully transparent so the page
         plane's ruled lines + red margin show straight through, and the
         only opaque marks are the ink (headings, list rows) and the
         translucent tab "stickers". No card, no panel. Sizes are in px;
         the drei distanceFactor in Notebook.tsx scales them onto the
         ~0.2 m page, so these are "page-relative" not screen pixels. */
      .notebook-page {
        display: flex;
        flex-direction: column;
        width: 200px;
        height: 272px;
        box-sizing: border-box;
        padding: 16px 16px 12px;
        background: transparent;
        font-family: "Lora", Georgia, serif;
        color: #43301f;
        user-select: none;
        -webkit-user-select: none;
        /* Safety net: content is sized to fit, but never let a stray
           overflow spill the tabs/cards off the page onto the desk. */
        overflow: hidden;
        /* Anchor for the folded page-corner turn buttons. */
        position: relative;
      }
      /* Headings: bold serif ink with a hand-ruled underline beneath. */
      .notebook-page__brand,
      .notebook-page__title {
        flex: 0 0 auto;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.005em;
        color: #43301f;
        padding-bottom: 6px;
        margin: 0 0 10px;
        border-bottom: 2px solid rgba(67, 48, 31, 0.5);
      }
      .notebook-tabs {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      /* Tabs read as translucent "stickers" pressed onto the page — the
         ruled lines stay faintly visible through them. */
      .notebook-tab {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        min-height: 32px;
        padding: 6px 11px;
        border: 1px solid rgba(120, 80, 40, 0.32);
        border-radius: 9px;
        background: rgba(255, 252, 244, 0.22);
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.1;
        color: #43301f;
        text-align: left;
        cursor: pointer;
        transition: background 140ms ease, border-color 140ms ease,
          box-shadow 140ms ease;
      }
      .notebook-tab:hover {
        background: rgba(255, 252, 244, 0.4);
      }
      .notebook-tab--active {
        background: rgba(231, 168, 64, 0.8);
        border-color: rgba(193, 122, 28, 0.85);
        color: #3a2410;
        box-shadow: 0 2px 9px rgba(150, 90, 20, 0.32);
      }
      .notebook-tab__count {
        flex: 0 0 auto;
        font-size: 11px;
        font-weight: 700;
        color: #5b4326;
        background: rgba(110, 74, 38, 0.16);
        border-radius: 9px;
        padding: 1px 8px;
        min-width: 14px;
        text-align: center;
      }
      .notebook-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      /* List rows: a colour swatch + inked title + right-aligned time,
         printed straight on the ruling — no row background. */
      .notebook-entry {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 3px 2px;
        border: none;
        background: transparent;
        font-family: inherit;
        text-align: left;
        cursor: pointer;
        border-radius: 6px;
        transition: background 120ms ease;
      }
      .notebook-entry:hover {
        background: rgba(231, 168, 64, 0.18);
      }
      .notebook-entry__swatch {
        flex: 0 0 auto;
        width: 19px;
        height: 19px;
        border-radius: 5px;
        border: 1px solid rgba(120, 80, 40, 0.4);
        box-shadow: 0 1px 2px rgba(80, 50, 20, 0.25);
      }
      .notebook-entry__text {
        flex: 1 1 auto;
        font-size: 16px;
        font-weight: 700;
        color: #34281b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Room rows on the "Your Rooms" restore page reuse the note-entry
         layout but show a door glyph instead of a colour swatch (issue #83). */
      .nb-room-swatch {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(231, 168, 64, 0.18);
        font-size: 13px;
      }
      .notebook-entry__time {
        flex: 0 0 auto;
        font-size: 12px;
        color: #8a6e4c;
      }
      .notebook-empty {
        font-size: 14px;
        font-style: italic;
        color: #7a5e3c;
        padding: 18px 2px;
        line-height: 1.5;
      }
      /* Passive page indicator (the dots) — navigation itself is the
         folded page-corners below. */
      .nb-pagenav {
        flex: 0 0 auto;
        display: flex;
        justify-content: center;
        margin-top: auto;
        padding-top: 10px;
        /* clear the bottom-corner turn buttons */
        padding-bottom: 4px;
      }

      /* Folded page-corners — the "turn the page" affordance. A triangle
         of slightly-darker paper curls up from the bottom outer corner,
         lifting on hover, with a faint chevron. Beautiful + book-native;
         no HUD arrows. */
      .nb-corner {
        position: absolute;
        bottom: 0;
        width: 34px;
        height: 34px;
        border: none;
        padding: 0;
        background: transparent;
        cursor: pointer;
        color: rgba(110, 74, 38, 0.7);
        transition: transform 160ms ease, filter 160ms ease;
      }
      .nb-corner::before {
        content: "";
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 100%;
        box-shadow: 0 1px 5px rgba(90, 55, 20, 0.28);
      }
      .nb-corner--next {
        right: 0;
      }
      .nb-corner--next::before {
        right: 0;
        background: linear-gradient(
          315deg,
          rgba(225, 205, 165, 0.95) 0%,
          rgba(208, 184, 140, 0.95) 46%,
          transparent 48%
        );
        border-bottom-right-radius: 4px;
      }
      .nb-corner--prev {
        left: 0;
      }
      .nb-corner--prev::before {
        left: 0;
        background: linear-gradient(
          45deg,
          rgba(225, 205, 165, 0.95) 0%,
          rgba(208, 184, 140, 0.95) 46%,
          transparent 48%
        );
        border-bottom-left-radius: 4px;
      }
      .nb-corner:hover {
        transform: scale(1.12);
        filter: drop-shadow(0 2px 4px rgba(90, 55, 20, 0.35));
      }
      .nb-corner__chev {
        position: absolute;
        bottom: 4px;
        font-size: 13px;
        line-height: 1;
        font-family: Georgia, serif;
      }
      .nb-corner--next .nb-corner__chev { right: 5px; }
      .nb-corner--prev .nb-corner__chev { left: 5px; }

      .notebook-pageturn__dots {
        display: flex;
        gap: 7px;
      }
      .notebook-pageturn__dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(110, 74, 38, 0.3);
      }
      .notebook-pageturn__dot--on {
        background: #e0962a;
      }

      /* ── Notebook ownership redesign (4-stage flow) ─────────────────
         Room Ledger + full-spread Claim → Letter Sent → Certificate, with
         a page-turn between every stage. All printed on the transparent
         ruled paper; gold/wax vocabulary borrowed from the cover. */

      /* Page-turn: both pages re-mount on a view/stage change (keyed) so
         this replays — left page hinges at the spine (right edge), right
         page at the spine (left edge), sweeping in like a turned leaf. */
      .np-turn--l {
        transform-origin: right center;
        animation: np-turn-l 460ms cubic-bezier(0.22, 0.8, 0.2, 1) both;
        backface-visibility: hidden;
      }
      .np-turn--r {
        transform-origin: left center;
        animation: np-turn-r 460ms cubic-bezier(0.22, 0.8, 0.2, 1) both;
        backface-visibility: hidden;
      }
      @keyframes np-turn-l {
        from { opacity: 0; transform: perspective(900px) rotateY(-34deg); }
        to { opacity: 1; transform: perspective(900px) rotateY(0deg); }
      }
      @keyframes np-turn-r {
        from { opacity: 0; transform: perspective(900px) rotateY(34deg); }
        to { opacity: 1; transform: perspective(900px) rotateY(0deg); }
      }

      /* Tabs: icons, divider, locked deed tab. */
      .nb-tab__icon {
        flex: 0 0 auto;
        width: 16px;
        text-align: center;
        font-size: 13px;
        line-height: 1;
        opacity: 0.85;
      }
      .nb-tab__label {
        flex: 1 1 auto;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .notebook-tabs__divider {
        height: 1px;
        margin: 4px 2px;
        background: rgba(67, 48, 31, 0.28);
      }
      .notebook-tab--deed {
        border-style: dashed;
        border-color: rgba(193, 122, 28, 0.55);
      }
      .notebook-tab--locked { opacity: 0.55; cursor: default; }
      .notebook-tab--locked:hover { background: rgba(255, 252, 244, 0.22); }

      /* Room Ledger card. */
      .nb-ledger {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(120, 80, 40, 0.4);
        border-radius: 9px;
        padding: 10px 11px;
      }
      .nb-ledger__name { font-size: 14px; font-weight: 700; color: #34281b; }
      .nb-ledger__sub {
        font-size: 10.5px;
        color: #7a5e3c;
        line-height: 1.3;
        margin: 2px 0 6px;
      }
      .nb-ledger__stats {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3px 10px;
        margin: 0 0 6px;
        font-size: 12px;
      }
      .nb-ledger__stats dt { color: #7a5e3c; }
      .nb-ledger__stats dd {
        margin: 0;
        text-align: right;
        font-weight: 700;
        color: #34281b;
      }
      .nb-ledger__statusval {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
      }
      .nb-ledger__dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1px solid rgba(120, 80, 40, 0.6);
        background: transparent;
      }
      .nb-ledger__dot--owned { background: #1f7a3a; border-color: #1f7a3a; }
      .nb-ledger__recent-h {
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #8a6e4c;
        border-top: 1px solid rgba(120, 80, 40, 0.25);
        padding-top: 6px;
        margin-bottom: 3px;
      }
      .nb-ledger__recent {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .nb-ledger__row {
        display: flex;
        align-items: center;
        gap: 8px;
        border: none;
        background: transparent;
        padding: 3px 2px;
        font-family: inherit;
        text-align: left;
        cursor: pointer;
        border-radius: 5px;
      }
      .nb-ledger__row:hover { background: rgba(231, 168, 64, 0.18); }
      .nb-ledger__check { flex: 0 0 auto; color: #8a6e4c; font-size: 13px; }
      .nb-ledger__rowtext {
        flex: 1 1 auto;
        font-size: 13px;
        color: #34281b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nb-ledger__rowtime { flex: 0 0 auto; font-size: 11px; color: #8a6e4c; }
      .nb-ledger__claim {
        flex: 0 0 auto;
        margin-top: 9px;
        padding: 8px 12px;
        border: 1.5px solid rgba(160, 70, 40, 0.7);
        border-radius: 9px;
        background: rgba(255, 252, 244, 0.25);
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        color: #8a3b1c;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: background 140ms ease;
      }
      .nb-ledger__claim:hover { background: rgba(231, 168, 64, 0.3); }
      .nb-ledger__claim--view {
        border-color: rgba(193, 122, 28, 0.7);
        color: #8a5a14;
      }
      /* Guest-only Restore entry — secondary text link under Claim
         (issue #82, ADR-0019). */
      .nb-ledger__restore {
        flex: 0 0 auto;
        margin-top: 6px;
        padding: 2px;
        border: none;
        background: none;
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        color: #8a6e4c;
        cursor: pointer;
        text-align: center;
        text-decoration: underline;
        text-underline-offset: 2px;
        transition: color 140ms ease;
      }
      .nb-ledger__restore:hover { color: #5b4326; }

      /* Claim flow — left display + right ownership record. */
      .nb-flow-right { display: flex; flex-direction: column; height: 100%; }
      .nb-claim-left { display: flex; flex-direction: column; height: 100%; }
      .nb-claim-left__title {
        font-size: 30px;
        font-weight: 700;
        line-height: 1.04;
        color: #2f2113;
      }
      .nb-claim-left__rule {
        width: 56px;
        height: 3px;
        background: rgba(160, 70, 40, 0.7);
        margin: 10px 0 14px;
      }
      .nb-claim-left__copy {
        font-size: 13px;
        line-height: 1.5;
        color: #5b4326;
        margin: 0;
      }
      .nb-deco {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 30px;
      }
      .nb-deco__tag {
        font-size: 11px;
        font-style: italic;
        color: #7a5e3c;
        border: 1px solid rgba(120, 80, 40, 0.4);
        border-radius: 4px;
        padding: 2px 7px;
        background: rgba(255, 252, 244, 0.3);
      }
      .nb-field__label { font-size: 13px; color: #5b4326; margin-bottom: 4px; }
      .nb-field__input {
        width: 100%;
        box-sizing: border-box;
        border: none;
        border-bottom: 1.5px solid rgba(120, 80, 40, 0.6);
        background: transparent;
        padding: 6px 2px;
        font-family: inherit;
        /* 15px (not 17) so a full-length email fits the 168px page width
           without clipping at the page edge. */
        font-size: 15px;
        font-style: italic;
        color: #34281b;
      }
      .nb-field__input::placeholder { color: rgba(122, 94, 60, 0.55); }
      .nb-field__input:focus {
        outline: none;
        border-bottom-color: rgba(160, 70, 40, 0.9);
      }
      .nb-claim__hint {
        font-size: 12px;
        color: #7a5e3c;
        line-height: 1.4;
        margin: 12px 0 18px;
      }
      /* Restore form left page (issue #82 redesign): title + tagline +
         the guest-cleanup consent gate, sized to fit the fixed paper. */
      .nb-restore-left__title {
        font-size: 21px;
        font-weight: 700;
        line-height: 1.04;
        color: #2f2113;
      }
      /* Tighter rule on the restore-left page only (scoped so the Claim
         page's rule spacing is untouched). */
      .nb-restore-left .nb-claim-left__rule { margin: 7px 0 9px; }
      .nb-restore-left__copy {
        font-size: 12px;
        line-height: 1.4;
        color: #5b4326;
        margin: 0 0 10px;
      }
      /* Restore guest-cleanup consent gate (issue #84, ADR-0019). Compact
         so the warning + consent fit beneath the tagline on the left page. */
      .nb-restore-warn {
        border: 1.5px solid rgba(160, 70, 40, 0.45);
        border-radius: 9px;
        background: rgba(231, 168, 64, 0.12);
        padding: 10px 12px;
        margin: 0;
      }
      .nb-restore-warn__title {
        font-size: 12.5px;
        font-weight: 700;
        color: #9a3b1c;
        margin: 0 0 5px;
      }
      .nb-restore-warn__copy {
        font-size: 11.5px;
        color: #7a5e3c;
        line-height: 1.4;
        margin: 0 0 8px;
      }
      .nb-restore-consent {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 11.5px;
        color: #4a3526;
        line-height: 1.35;
        cursor: pointer;
      }
      .nb-restore-consent input {
        margin-top: 2px;
        accent-color: #9a3b1c;
        cursor: pointer;
      }
      .nb-claim__cta {
        align-self: flex-start;
        padding: 10px 22px;
        border: 1.5px solid rgba(160, 70, 40, 0.8);
        border-radius: 9px;
        background: transparent;
        font-family: inherit;
        font-size: 16px;
        font-weight: 700;
        color: #9a3b1c;
        cursor: pointer;
        transition: background 140ms ease;
      }
      .nb-claim__cta:hover:not(:disabled) { background: rgba(231, 168, 64, 0.2); }
      .nb-claim__cta:disabled { opacity: 0.45; cursor: default; }
      .nb-claim__sig {
        margin-top: auto;
        font-size: 14px;
        font-style: italic;
        color: #8a6e4c;
        font-family: "Segoe Script", "Brush Script MT", cursive;
      }
      .notebook-claim__error {
        font-size: 12px;
        color: #9a3b1c;
        margin: 0 0 8px;
        line-height: 1.4;
      }

      /* Letter sent (stage 3). */
      .nb-sent-left {
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .nb-sent-left__title {
        font-size: 22px;
        font-style: italic;
        color: #4a3526;
        font-family: "Segoe Script", "Brush Script MT", cursive;
        line-height: 1.2;
        margin: 0 0 14px;
      }
      .nb-sent-left__env { font-size: 64px; }
      .nb-sent-left__spark { font-size: 16px; color: #c9a24a; margin-top: 8px; }
      .nb-sent__copy { font-size: 13px; color: #5b4326; margin: 6px 0 4px; }
      .nb-sent__email {
        font-size: 17px;
        font-style: italic;
        font-weight: 700;
        color: #34281b;
        margin: 0 0 14px;
        word-break: break-all;
      }
      .nb-sent__hint {
        font-size: 12px;
        color: #7a5e3c;
        line-height: 1.5;
        margin: 0;
      }
      .nb-back {
        align-self: center;
        margin-top: auto;
        padding: 9px 18px;
        border: 1px solid rgba(120, 80, 40, 0.5);
        border-radius: 8px;
        background: rgba(255, 252, 244, 0.25);
        font-family: inherit;
        font-size: 14px;
        color: #5b4326;
        cursor: pointer;
      }
      .nb-back:hover { background: rgba(231, 168, 64, 0.22); }

      /* Restore-with-password right page (issue #95, ADR-0020): the page
         now carries email + password + the Reopen CTA + a magic-link
         fallback + Back, so the hint margins are tightened and the CTA
         sits flush so all five fit the fixed 200×272 paper without
         clipping. Scoped to the restore form so the Claim page is untouched. */
      .nb-restore-form .notebook-page__title { margin: 0 0 6px; }
      .nb-restore-form .nb-field__label { margin-bottom: 2px; }
      .nb-restore-form .nb-claim__hint { margin: 5px 0 7px; }
      .nb-restore-form .nb-claim__cta {
        padding: 7px 16px;
        font-size: 15px;
        margin-bottom: 7px;
      }
      .nb-restore-form .nb-back { margin-top: 4px; padding: 6px 14px; }
      /* Magic-link fallback ("email me a link instead"): a quiet, underlined
         text affordance so the password path clearly reads as primary. */
      .nb-restore-fallback {
        align-self: flex-start;
        padding: 0;
        border: none;
        background: transparent;
        font-family: inherit;
        font-size: 12px;
        color: #7a5e3c;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .nb-restore-fallback:hover:not(:disabled) { color: #9a3b1c; }
      .nb-restore-fallback:disabled { opacity: 0.45; cursor: default; }

      /* Restore edge states (issue #85): "no room found" + send failure.
         Reuses the restore spread's warm palette and the shared CTA / back
         buttons; only the centred mark + soft copy are new. */
      .nb-empty, .nb-error {
        align-items: center;
        text-align: center;
      }
      .nb-empty .nb-claim__cta, .nb-error .nb-claim__cta { align-self: center; }
      .nb-empty__mark, .nb-error__mark {
        font-size: 56px;
        margin: 6px 0 10px;
      }
      .nb-empty__copy, .nb-error__copy {
        font-size: 13px;
        color: #5b4326;
        line-height: 1.55;
        margin: 0 0 16px;
      }
      .nb-error__detail {
        font-size: 12px;
        font-style: italic;
        color: #9a3b1c;
        line-height: 1.4;
        margin: 0 0 16px;
        word-break: break-word;
      }

      /* Ownership certificate (stage 4). */
      .nb-cert-left { height: 100%; }
      .nb-cert-left__frame {
        height: 100%;
        box-sizing: border-box;
        border: 2px double rgba(150, 100, 40, 0.6);
        border-radius: 6px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .nb-cert-left__kicker { font-size: 13px; font-style: italic; color: #6e4a26; }
      .nb-cert-left__title {
        font-size: 26px;
        font-weight: 700;
        color: #3a2a16;
        margin-bottom: 6px;
      }
      .nb-cert-left__door { font-size: 56px; margin: 6px 0; }
      .nb-cert-left__note {
        font-size: 12px;
        font-style: italic;
        color: #7a5e3c;
        line-height: 1.4;
        margin: 4px 0 0;
      }
      .nb-cert-left__seal { margin-top: auto; font-size: 30px; }
      .nb-cert__line { font-size: 12px; color: #7a5e3c; margin: 8px 0 2px; }
      .nb-cert__name {
        font-size: 20px;
        font-weight: 700;
        font-style: italic;
        color: #34281b;
        border-bottom: 1px solid rgba(120, 80, 40, 0.4);
        padding-bottom: 2px;
        margin: 0;
        font-family: "Segoe Script", "Brush Script MT", cursive;
      }
      .nb-cert__room {
        font-size: 17px;
        font-weight: 700;
        font-style: italic;
        color: #34281b;
        border-bottom: 1px solid rgba(120, 80, 40, 0.4);
        padding-bottom: 2px;
        margin: 0;
      }
      .nb-cert__claimed { font-size: 12px; color: #5b4326; margin: 10px 0 2px; }
      .nb-cert__claimed span {
        font-style: italic;
        border-bottom: 1px solid rgba(120, 80, 40, 0.4);
      }
      .nb-cert__statusrow {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 14px;
        font-weight: 700;
        color: #34281b;
        margin-top: 8px;
      }
      .nb-cert__dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #1f7a3a;
      }
      .nb-cert__stamp {
        margin-top: 8px;
        align-self: flex-end;
        border: 2px solid rgba(170, 60, 45, 0.7);
        color: rgba(170, 60, 45, 0.85);
        border-radius: 50%;
        width: 62px;
        height: 62px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transform: rotate(-12deg);
        line-height: 1.25;
      }
      .nb-cert__sig {
        margin-top: 10px;
        font-size: 13px;
        font-style: italic;
        color: #8a6e4c;
        font-family: "Segoe Script", "Brush Script MT", cursive;
      }

      /* ── Search overlay (issue #66, ADR-0017) ──────────────────────
         Command-palette chrome: a dimmed backdrop with a centered glass
         panel, sharing the dark glass-and-cyan vocabulary of RoomPicker
         / ToolPalette so it reads as part of the same chrome set. */
      .search-overlay {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 14vh;
        background: rgba(10, 8, 16, 0.45);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        animation: search-fade 140ms ease-out;
      }
      @keyframes search-fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .search-panel {
        width: min(560px, 92vw);
        max-height: 64vh;
        display: flex;
        flex-direction: column;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(20, 16, 28, 0.94);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        animation: search-rise 180ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes search-rise {
        from { opacity: 0; transform: translateY(-10px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .search-input-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }
      .search-input-icon {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.5);
        line-height: 1;
      }
      .search-input {
        flex: 1 1 auto;
        border: none;
        background: transparent;
        outline: none;
        color: rgba(255, 255, 255, 0.95);
        font-size: 16px;
      }
      .search-input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }
      .search-hint {
        padding: 22px 18px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.5);
      }
      .search-results {
        list-style: none;
        margin: 0;
        padding: 6px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .search-result {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 9px 12px;
        border: none;
        border-radius: 9px;
        background: transparent;
        color: rgba(255, 255, 255, 0.88);
        text-align: left;
        cursor: pointer;
      }
      .search-result--active {
        background: rgba(255, 255, 255, 0.08);
      }
      .search-result__swatch {
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
