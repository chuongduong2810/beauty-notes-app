<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Beauty Notes</title>
    <!-- Lora — warm serif, claude.ai-style — for the (invisible) DOM
         textarea. Google Fonts CDN serves WOFF2 which the browser uses
         natively. The WebGL SDF text in NoteMesh.tsx loads the same
         font as a self-hosted TTF from /public/fonts/, because troika
         can't follow the Google CSS link (it needs a direct TTF URL). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #0e0b16; }

      /* Styled scrollbar for the NoteEditor textarea — appears when a
         focused Note's body is longer than the visible rect. Firefox
         uses the standard scrollbar-* properties; Chromium / WebKit
         uses the ::-webkit-* pseudo-elements. Colours are tied to the
         warm palette so the bar reads as part of the paper rather than
         a browser chrome graft. */
      textarea[data-note-editor] {
        scrollbar-width: thin;
        scrollbar-color: rgba(42, 35, 48, 0.35) transparent;
      }
      textarea[data-note-editor]::-webkit-scrollbar {
        width: 8px;
      }
      textarea[data-note-editor]::-webkit-scrollbar-track {
        background: transparent;
      }
      textarea[data-note-editor]::-webkit-scrollbar-thumb {
        background: rgba(42, 35, 48, 0.35);
        border-radius: 4px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      textarea[data-note-editor]::-webkit-scrollbar-thumb:hover {
        background: rgba(42, 35, 48, 0.6);
        background-clip: content-box;
      }

      /* Futuristic hover toast for interactive 3D props (issue #35
         follow-up). Glass background, cyan neon border, scoped to a
         single .hover-toast class so the same styles apply to any
         object that drops in <HoverTooltip>. Pointer events off so
         the tooltip can never eat a click meant for the prop. */
      .hover-toast {
        position: relative;
        font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
        padding: 8px 14px;
        min-width: 140px;
        background: rgba(10, 12, 22, 0.72);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(92, 242, 232, 0.55);
        border-radius: 6px;
        color: #d8fffb;
        text-align: center;
        box-shadow:
          0 0 14px rgba(92, 242, 232, 0.28),
          inset 0 0 10px rgba(92, 242, 232, 0.08),
          0 4px 20px rgba(0, 0, 0, 0.45);
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
        transform-origin: 50% 100%;
        animation: hover-toast-enter 160ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .hover-toast::before {
        /* Thin gradient hairline at the top — adds the "HUD" feel. */
        content: "";
        position: absolute;
        top: -1px;
        left: 10%;
        right: 10%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          #5cf2e8 50%,
          transparent 100%
        );
        opacity: 0.85;
      }
      .hover-toast::after {
        /* Tiny downward triangle pointer toward the anchored object. */
        content: "";
        position: absolute;
        left: 50%;
        bottom: -6px;
        width: 10px;
        height: 10px;
        transform: translateX(-50%) rotate(45deg);
        background: rgba(10, 12, 22, 0.72);
        border-right: 1px solid rgba(92, 242, 232, 0.55);
        border-bottom: 1px solid rgba(92, 242, 232, 0.55);
        box-shadow: 2px 2px 8px rgba(92, 242, 232, 0.18);
      }
      .hover-toast__title {
        font-size: 11px;
        letter-spacing: 0.18em;
        font-weight: 600;
        text-transform: uppercase;
        color: #5cf2e8;
        text-shadow: 0 0 6px rgba(92, 242, 232, 0.55);
      }
      .hover-toast__subtitle {
        margin-top: 2px;
        font-size: 11px;
        letter-spacing: 0.04em;
        color: rgba(216, 255, 251, 0.78);
      }
      @keyframes hover-toast-enter {
        from {
          opacity: 0;
          transform: translateY(4px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
